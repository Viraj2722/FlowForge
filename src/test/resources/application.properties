# Test-only overrides (merged on top of the main application.yml).
# Disable the background schedulers during tests so their timers can't race with
# integration tests that commit data. The scheduler beans still exist, so the
# scheduler test can invoke their poll methods directly and deterministically.
flowforge.scheduler.enabled=false

# Don't auto-create the bootstrap admin during tests (avoids polluting the shared DB;
# tests create their own users as needed).
flowforge.bootstrap-admin.enabled=false
